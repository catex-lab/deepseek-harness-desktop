<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>DeepSeek Harness</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#0E1B33;color:#e8eefc;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card{width:360px;padding:40px 36px;text-align:center}
.logo{width:72px;height:72px;margin:0 auto 20px;display:block}
.brand{font-size:22px;font-weight:600;letter-spacing:-0.01em}
.sub{font-size:12px;color:#8fa3c8;margin:6px 0 28px}
.loader{width:34px;height:34px;margin:0 auto 16px;border:3px solid #24365c;border-top-color:#5b8cff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.status{font-size:13px;color:#c6d4ee;min-height:18px}
.steps{margin:22px 0 0;padding-top:16px;border-top:1px solid #24365c;text-align:left;font-size:12px;color:#8fa3c8;line-height:1.9}
.step{display:flex;align-items:center;gap:8px}
.dot{width:5px;height:5px;border-radius:50%;background:#3a4d75;flex-shrink:0}
.step.done .dot{background:#5b8cff}
.step.done .label{color:#e8eefc}
.step.active .dot{background:#5b8cff;box-shadow:0 0 0 3px rgba(91,140,255,.18)}
.footer{margin-top:22px;padding-top:14px;border-top:1px solid #24365c;font-size:10.5px;color:#6f86b0;display:flex;justify-content:space-between;align-items:center}
.badge{font-size:10px;padding:2px 8px;border-radius:10px;background:#16263f;color:#8fa3c8}
</style></head>
